# Render Blueprint — MyCareerArchive API (+ database migrations).
#
# Apply: Render dashboard -> New -> Blueprint -> select this repo.
# Then fill every `sync: false` var in the dashboard (Render prompts for
# them). Placeholders marked TODO must be replaced with your real URLs.
#
# Assumes: Neon Postgres (pooled URL), Supabase Storage (S3 protocol),
# Brevo email, Vercel frontend. Full checklist: docs/DEPLOY.md.
services:
  - type: web
    name: mycareerarchive-api
    runtime: node
    region: singapore
    plan: free
    # --include=dev: Render builds with NODE_ENV=production, which makes
    # plain `npm ci` skip devDependencies — but the build needs @types/*
    # and the TS compiler. Migrations run last so a bad migration fails
    # the build instead of boot-looping the new version.
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build:api && npm run db:deploy
    startCommand: npm run start --workspace=@mycareerarchive/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Frontend origin: auth cookies become first-party via the Next.js /api proxy,
      # and OAuth/email links land on the frontend (proxied to this service).
      - key: BETTER_AUTH_URL
        value: https://mycareerarchive-tdg9.vercel.app
      # Production frontend. Comma-separate more exact origins if needed.
      # Non-secret values sync from this file automatically on deploy.
      - key: WEB_ORIGIN
        value: https://mycareerarchive-tdg9.vercel.app
      # Glob patterns (better-auth syntax: `*` never crosses `/`) for
      # preview deployments of this project. Same list feeds both Express
      # CORS and better-auth trustedOrigins, so preflight and auth agree.
      - key: WEB_ORIGIN_PATTERNS
        value: https://mycareerarchive-*.vercel.app
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_S3_BUCKET
        value: evidence
      - key: EVIDENCE_MAX_MB
        value: "25"
      # Secrets below are intentionally empty here — set them in the
      # Render dashboard (Environment tab). Never commit real values.
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
